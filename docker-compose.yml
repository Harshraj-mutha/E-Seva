version: "3.9"


services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 8520
      MYSQL_DATABASE: order_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p8520"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  eureka-server:
    build: ./EurekaServer

    container_name: eureka-server

    ports:
      - "8761:8761"
  
  product-service:
    build: ./product
    container_name: product-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: 8520
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
       mysql:
        condition: service_healthy
       eureka-server:
        condition: service_started   
    ports:
     - "8081:8081"


  order-service:
    build: ./Order
    container_name: order-service
    depends_on:
      mysql:
       condition: service_healthy
      eureka-server:
       condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: 8520
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
      
  api-gateway:
    build: ./ApiGateway
    container_name: api-gateway
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server 
    ports:
      - "8067:8067"
      
  auth-service:
    build: ./AuthService
    container_name: auth-service
    depends_on:
      mysql:
       condition: service_healthy
      eureka-server:
       condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: 8520
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084" 